name: Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-windows:

    name: Windows (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build_type: Debug
            artifact_suffix: debug
          - os: windows-2022
            build_type: Release
            artifact_suffix: release

    steps:
    - uses: actions/checkout@v4

    - name: info
      run: |
        cmake --version
        cmake -h
        wmic logicaldisk get size, freespace, caption

    - name: configure
      shell: bash
      run: |
        cmake -B D:\\a\\mlib\\mlib\\build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -D ENABLE_ALL_TESTS=ON
        cmake --build D:\\a\\mlib\\mlib\\build --config ${{ matrix.build_type }}

    - name: archive logs
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.artifact_suffix }}-detailed.log
        path: build/detailed.log

    - name: test library
      shell: bash
      run: |
        ctest -C D:\\a\\mlib\\mlib\\build --output-on-failure > test_output.txt 2>&1 || true

    - name: Extract and save test count
      shell: bash
      run: |
        TEST_COUNT=$(grep -c "^[0-9]*: Test " test_output.txt || echo "0")
        if [ "$TEST_COUNT" -eq 0 ]; then
          TEST_COUNT=$(ctest --test-dir D:\\a\\mlib\\mlib\\build -N --quiet 2>/dev/null | wc -l || echo "0")
        fi
        echo "Current test count: $TEST_COUNT"
        echo "$TEST_COUNT" > test_count.txt

    - name: Download previous test count
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: test-count-windows-${{ matrix.artifact_suffix }}
        path: previous_count

    - name: Compare test counts
      shell: bash
      run: |
        CURRENT=$(cat test_count.txt)
        PREVIOUS=$(cat previous_count/test_count.txt 2>/dev/null || echo "0")
        echo "Previous test count: $PREVIOUS"
        echo "Current test count: $CURRENT"
        if [ "$CURRENT" -lt "$PREVIOUS" ]; then
          echo "ERROR: Test count decreased from $PREVIOUS to $CURRENT"
          exit 1
        fi
        echo "Test count check passed (Previous: $PREVIOUS, Current: $CURRENT)"

    - name: Upload test count for next run
      uses: actions/upload-artifact@v4
      with:
        name: test-count-windows-${{ matrix.artifact_suffix }}
        path: test_count.txt
        retention-days: 30

    - name: archive error 1
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: windows-${{ matrix.artifact_suffix }}-CMakeOutput.log
        path: D:\\a\\mlib\\mlib\\build\\CMakeFiles\\CMakeOutput.log

    - name: archive error 2
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: windows-${{ matrix.artifact_suffix }}-CMakeError.log
        path: D:\\a\\mlib\\mlib\\build\\CMakeFiles\\CMakeError.log
