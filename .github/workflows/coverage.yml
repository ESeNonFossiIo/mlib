name: Coverage

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read  # overridden to write in the update-badges job

jobs:
  cpp-coverage:
    name: C++ Coverage (gcovr)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            numdiff clang llvm gcovr

      - name: Configure CMake with coverage flags
        run: |
          cmake -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ALL_TESTS=ON \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Run tests
        working-directory: ${{ github.workspace }}/build
        run: make run_tests
        continue-on-error: true

      - name: Generate coverage report
        run: |
          mkdir -p ${{ github.workspace }}/coverage_html
          gcovr \
            --root ${{ github.workspace }} \
            --gcov-executable "llvm-cov gcov" \
            --exclude "${{ github.workspace }}/tests/" \
            --exclude "${{ github.workspace }}/build/" \
            --html-details ${{ github.workspace }}/coverage_html/index.html \
            --xml ${{ github.workspace }}/coverage.xml \
            --print-summary

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-html
          path: coverage_html/
          retention-days: 14

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-xml
          path: coverage.xml
          retention-days: 14

  python-coverage:
    name: Python Coverage (pytest-cov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends numdiff clang

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Build C++ bindings
        run: |
          cmake -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build ${{ github.workspace }}/build

      - name: Install Python test dependencies
        run: pip install pytest pytest-cov

      - name: Run Python tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/build/lib
        run: |
          pytest python/tests \
            --cov=numerixpy \
            --cov-report=html:python_coverage_html \
            --cov-report=xml:python_coverage.xml \
            --cov-report=term-missing
        continue-on-error: true

      - name: Upload Python HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-html
          path: python_coverage_html/
          retention-days: 14

      - name: Upload Python XML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-xml
          path: python_coverage.xml
          retention-days: 14

  update-badges:
    name: Update Coverage Badges
    needs: [cpp-coverage, python-coverage]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: write

    env:
      BADGES_BRANCH: badges

    steps:
      - name: Download C++ coverage XML
        uses: actions/download-artifact@v4
        with:
          name: cpp-coverage-xml
          path: artifacts/cpp
        continue-on-error: true

      - name: Download Python coverage XML
        uses: actions/download-artifact@v4
        with:
          name: python-coverage-xml
          path: artifacts/python
        continue-on-error: true

      - name: Generate badges
        run: |
          pip install --quiet "genbadge[coverage]"
          mkdir -p generated-badges
          if [ -f artifacts/cpp/coverage.xml ]; then
            genbadge coverage \
              -i artifacts/cpp/coverage.xml \
              -o generated-badges/coverage-cpp.svg \
              -n "C++ coverage"
          fi
          if [ -f artifacts/python/python_coverage.xml ]; then
            genbadge coverage \
              -i artifacts/python/python_coverage.xml \
              -o generated-badges/coverage-python.svg \
              -n "Python coverage"
          fi

      - name: Publish badges to ${{ env.BADGES_BRANCH }} branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! ls generated-badges/*.svg >/dev/null 2>&1; then
            echo "No badges generated; nothing to publish."
            exit 0
          fi

          work=$(mktemp -d)
          git clone --depth=1 --branch "$BADGES_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "$work" 2>/dev/null || {
              echo "Branch $BADGES_BRANCH does not exist; creating as orphan."
              git clone --depth=1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
                "$work"
              git -C "$work" checkout --orphan "$BADGES_BRANCH"
              git -C "$work" rm -rf . >/dev/null 2>&1 || true
            }

          cp generated-badges/*.svg "$work/"

          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Badges unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update coverage badges for ${SHA} [skip ci]"
          git push origin "HEAD:${BADGES_BRANCH}"
