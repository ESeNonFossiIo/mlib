name: Style

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends clang-format
        clang-format --version

    - name: Run clang-format check
      run: |
        ./scripts/clang_format.sh --check | tee clang_format_output.txt

    - name: Upload diff if formatting failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: clang-format-diff
        path: clang_format_output.txt
        retention-days: 14
