name: OSX

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

jobs:
  build-osx:

    name: OSX MLIB
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-activate-base: true
        python-version: 3.9

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -D ENABLE_ALL_TESTS=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Install conda dependencies
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        $CONDA/bin/conda env update --file ${{github.workspace}}/python/mlibpy_env.yml --name mlibpy_env

    - name: CPP Test
      working-directory: ${{github.workspace}}/build
      run: make run_tests > test_output.txt 2>&1 || true
      continue-on-error: true

    - name: Extract and save test count
      run: |
        TEST_COUNT=$(grep -c "^[0-9]*: Test " build/test_output.txt || echo "0")
        if [ "$TEST_COUNT" -eq 0 ]; then
          TEST_COUNT=$(ctest --test-dir build -N --quiet 2>/dev/null | wc -l || echo "0")
        fi
        echo "Current test count: $TEST_COUNT"
        echo "$TEST_COUNT" > test_count.txt

    - name: Download previous test count
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: test-count-release
        path: previous_count

    - name: Compare test counts
      run: |
        CURRENT=$(cat test_count.txt)
        PREVIOUS=$(cat previous_count/test_count.txt 2>/dev/null || echo "0")
        echo "Previous test count: $PREVIOUS"
        echo "Current test count: $CURRENT"
        if [ "$CURRENT" -lt "$PREVIOUS" ]; then
          echo "ERROR: Test count decreased from $PREVIOUS to $CURRENT"
          exit 1
        fi
        echo "✓ Test count check passed (Previous: $PREVIOUS, Current: $CURRENT)"

    - name: Upload test count for next run
      uses: actions/upload-artifact@v4
      with:
        name: test-count-release
        path: test_count.txt
        retention-days: 30

    - name: Python Test
      working-directory: ${{github.workspace}}
      run: |
        conda install pytest
        $CONDA/bin/pytest ${{github.workspace}}/python/tests

    - name: archive error 1
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: osx-CMakeOutput.log
        path: ${{github.workspace}}/build/CMakeFiles/CMakeOutput.log

    - name: archive error 2
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: osx-CMakeError.log
        path: ${{github.workspace}}/build/CMakeFiles/CMakeError.log
